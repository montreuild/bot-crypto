#  ⚠️  Tous les membres ne cotent pas à Paris : Solvay (`SOLB.BR`, Bruxelles)
#  et Aperam (`APAM.AS`, Amsterdam) appartiennent à l'indice mais se traitent
#  sur une autre place Euronext. Leur suffixe DOIT être écrit explicitement —
#  sans point, le provider ajoute `.PA` et interroge une ligne parisienne
#  inexistante, ce qui rend une réponse vide indiscernable d'une suspension.
#
#  Format : cf. app/core/universe.py. Un membre peut s'écrire en forme courte
#  (`- AIR.PA`) ou longue (`- {symbol: AIR.PA, name: Airbus}`).
