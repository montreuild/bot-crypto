# Config ruff — remplace flake8/pyflakes dispersés (cf. requirements.txt).
# line-length=120 aligné sur la convention documentée dans CONTRIBUTING.md
# (PEP 8, line length 120 chars) pour éviter un reformatage de masse.
line-length = 120
target-version = "py312"

extend-exclude = [
    "__pycache__",
    ".venv",
    "venv",
    "data",
]

[lint]
select = ["F", "W", "E", "I"]

# app/core/indicators.py est une façade volontaire (ré-exports), cf. DEAD-07 :
# les imports "inutilisés" y sont intentionnels et déjà marqués `# noqa: F401`.
[lint.per-file-ignores]
"app/core/indicators.py" = ["F401"]
