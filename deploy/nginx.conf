upstream crypto_bot {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirection HTTPS (décommenter si certificat TLS en place)
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    # ── Sécurité headers ──────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Auth Basic (OPS-02) ───────────────────────────────────────────
    # Générer le fichier : htpasswd -c /etc/nginx/.htpasswd admin
    auth_basic           "Crypto Bot — Accès restreint";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── Frontend Next.js (build statique ou proxy) ────────────────────
    # Si le frontend tourne sur :3000 (dev) ou est servi en statique :
    location / {
        # Option A : proxy vers Next.js dev/prod
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── API FastAPI ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts généreux pour les requêtes longues (backtest, optim)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Server-Sent Events (optimizer stream) ─────────────────────────
    location /api/optimize/stream {
        proxy_pass             http://127.0.0.1:8000;
        proxy_http_version     1.1;
        proxy_set_header       Connection "";
        proxy_set_header       Cache-Control "no-cache";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     600s;   # optimisation peut durer ~10 min
        chunked_transfer_encoding on;
        # SEC-005 : conserver auth_basic (hérite du serveur). Le navigateur
        # renvoie les credentials basic auth pour EventSource same-origin.
        # L'API applique aussi verify_api_key / cookie api_key en aval.
    }

    # ── Logs ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/crypto-bot-access.log;
    error_log  /var/log/nginx/crypto-bot-error.log;
}
