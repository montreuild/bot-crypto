# ═══════════════════════════════════════════════════════════════
#  nginx.conf — Reverse proxy pour Crypto Bot
#  Fonctionnalités :
#    - HTTPS (port 443) avec certificat Let's Encrypt (Certbot)
#    - Authentification basique (htpasswd) protégeant le dashboard
#    - Désactivation des logs détaillés pour les Server-Sent Events (optimizer stream)
#    - Redirection HTTP → HTTPS
#    - Headers de sécurité (HSTS, X-Frame-Options…)
#
#  Installation :
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/crypto-bot
#    sudo ln -s /etc/nginx/sites-available/crypto-bot /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name _;          # remplacer par ton domaine si disponible
    return 301 https://$host$request_uri;
}

# Serveur HTTPS principal
server {
    listen 443 ssl http2;
    server_name _;          # remplacer par ton domaine (ex: bot.mondomaine.com)

    # ── Certificat SSL (géré par Certbot) ──────────────────────────────
    # Ces chemins sont remplis automatiquement par : sudo certbot --nginx
    # Avant Certbot, créer un certificat auto-signé temporaire :
    #   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/crypto-bot.key \
    #     -out /etc/ssl/certs/crypto-bot.crt \
    #     -subj "/CN=crypto-bot"
    ssl_certificate     /etc/ssl/certs/crypto-bot.crt;
    ssl_certificate_key /etc/ssl/private/crypto-bot.key;

    # ── Paramètres SSL modernes ────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Headers de sécurité ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # ── Authentification basique ───────────────────────────────────────
    # Créer le fichier htpasswd : sudo htpasswd -c /etc/nginx/.htpasswd botuser
    auth_basic           "Crypto Bot — Accès restreint";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── Proxy vers FastAPI (port 8000) ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts généreux pour les requêtes longues (backtest, optim)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Server-Sent Events (optimizer stream) ─────────────────────────
    # Désactiver le buffering pour que les événements arrivent en temps réel
    location /api/optimize/stream {
        proxy_pass             http://127.0.0.1:8000;
        proxy_http_version     1.1;
        proxy_set_header       Connection "";
        proxy_set_header       Cache-Control "no-cache";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     600s;   # optimisation peut durer ~10 min
        chunked_transfer_encoding on;
        # Pas d'auth requise si appelé depuis le dashboard déjà authentifié
        auth_basic off;
    }

    # ── Logs ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/crypto-bot-access.log;
    error_log  /var/log/nginx/crypto-bot-error.log;
}
