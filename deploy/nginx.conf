# ═══════════════════════════════════════════════════════════════
#  nginx.conf — Reverse proxy pour Crypto Bot (Next.js + FastAPI)
#  Fonctionnalités :
#    - HTTPS (port 443) avec certificat Let's Encrypt (Certbot)
#    - Authentification basique (htpasswd) en façade
#    - UI Next.js → 127.0.0.1:3000 (proxy same-origin /api/* → FastAPI)
#    - WebSocket /ws → 127.0.0.1:8000 (Next ne proxy pas les WS)
#    - SSE optimiseur sans buffering
#    - Redirection HTTP → HTTPS
#    - Headers de sécurité (HSTS, X-Frame-Options…)
#
#  Prérequis prod :
#    - API Docker/systemd sur 127.0.0.1:8000 (API_HOST_BIND=127.0.0.1)
#    - Frontend Next sur 127.0.0.1:3000 (profile full / build standalone)
#    - ENV=prod → OpenAPI /docs désactivés (SEC-006)
#    - WEB_API_KEY fort dans .env (injectée côté serveur Next, pas le navigateur)
#
#  Installation :
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/crypto-bot
#    sudo ln -s /etc/nginx/sites-available/crypto-bot /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name _;          # remplacer par ton domaine si disponible
    return 301 https://$host$request_uri;
}

# Serveur HTTPS principal
server {
    listen 443 ssl http2;
    server_name _;          # remplacer par ton domaine (ex: bot.mondomaine.com)

    # ── Certificat SSL (géré par Certbot) ──────────────────────────────
    # Ces chemins sont remplis automatiquement par : sudo certbot --nginx
    # Avant Certbot, créer un certificat auto-signé temporaire :
    #   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/crypto-bot.key \
    #     -out /etc/ssl/certs/crypto-bot.crt \
    #     -subj "/CN=crypto-bot"
    ssl_certificate     /etc/ssl/certs/crypto-bot.crt;
    ssl_certificate_key /etc/ssl/private/crypto-bot.key;

    # ── Paramètres SSL modernes ────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Headers de sécurité ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # connect-src 'self' : API same-origin + wss same-origin (/ws)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

    # ── Authentification basique (façade) ──────────────────────────────
    # Créer le fichier htpasswd : sudo htpasswd -c /etc/nginx/.htpasswd botuser
    # La WEB_API_KEY reste une 2e couche (injectée par le proxy Next serveur).
    auth_basic           "Crypto Bot — Accès restreint";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── WebSocket temps réel → FastAPI ─────────────────────────────────
    # C'est CE bloc qui rend le WS same-origin : le navigateur ouvre
    # `wss://votre-domaine/ws`, donc le cookie HttpOnly `api_key` posé sur le
    # domaine par le proxy Next accompagne la poignée de main. Ne PAS définir
    # NEXT_PUBLIC_WS_URL vers un autre hôte, cela laisserait le cookie derrière.
    location /ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Healthcheck API (optionnel, sans auth pour monitoring local) ───
    location = /health {
        auth_basic off;
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Server-Sent Events (optimizer stream) via Next ────────────────
    # Passe par Next pour l'injection X-API-Key ; buffering off obligatoire.
    location /api/optimize/stream {
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        "";
        proxy_set_header       Cache-Control     "no-cache";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     600s;
        chunked_transfer_encoding on;
        # SEC-005 : conserver auth_basic (hérite du serveur).
    }

    # ── UI Next.js + proxy /api/* same-origin ─────────────────────────
    # Next (port 3000) sert le dashboard et proxifie /api/* vers FastAPI
    # en injectant WEB_API_KEY côté serveur (jamais exposée au navigateur).
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts généreux pour backtest / optim / ML via le proxy Next
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Logs ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/crypto-bot-access.log;
    error_log  /var/log/nginx/crypto-bot-error.log;
}
