# Miroir de .github/workflows/ci.yml — le dépôt n'avait pas de pipeline GitLab.
# Jobs : lint (ruff) → test (pytest) → security (pip-audit) → frontend.

stages:
  - lint
  - test
  - security
  - frontend

mypy:
  stage: lint
  image: python:3.14-bookworm
  allow_failure: false
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - python -m mypy app/core app/engine app/live app/ml app/api app/strategies

default:
  interruptible: true

lint:
  stage: lint
  image: python:3.14-bookworm
  script:
    - pip install ruff==0.15.8
    - ruff check .

test:
  stage: test
  image: python:3.14-bookworm
  variables:
    CRYPTO_BOT_INLINE_COMPUTE: "1"
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - python -m pytest tests/ -q --tb=short -m "not slow"
        --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=64

security:
  stage: security
  image: python:3.14-bookworm
  script:
    - pip install pip-audit
    - pip-audit -r requirements.txt -r requirements-dev.txt
  allow_failure: false

frontend:
  stage: frontend
  image: node:22-bookworm
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run type-check
    - npm run test:coverage
    - npm run build
