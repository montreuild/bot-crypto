logging:
  level: INFO
  file: logs/bot.log
  max_bytes: 10485760
  backup_count: 5

web:
  host: 0.0.0.0
  port: 8000
  refresh_interval: 5
  api_key: ${WEB_API_KEY}
  # SEC-003 : web.allow_insecure YAML est IGNORÉ. Pour du dev local avec
  # host ouvert sans api_key, exporter uniquement ALLOW_INSECURE_WEB=1.

ui:
  risk_preset:
  expert_mode: false

perf:
  # Taille du cache LRU process-wide des colonnes pré-calculées (_pre_*),
  # partagé entre stratégies/trials tournant sur la même plage OHLCV
  # (PERF-01). 128 par défaut (avant : 16 fixe, non configurable).
  precompute_cache_size: 128

notifications:
  telegram_enabled: false
  telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
  whatsapp_enabled: false
  email_enabled: false
