# ============================================================================
#  bot-crypto — sommaire de configuration
# ============================================================================
#
#  Ce fichier ne contient plus de réglages : il déclare les briques. Chaque
#  fichier de `config/` porte UNE responsabilité, alignée sur une brique du
#  code — c'est ce qui permet de savoir où écrire sans relire 340 lignes :
#
#    config/venues.yaml     où et comment on exécute (spot/margin, coûts,
#                           actions Euronext)     → app/core/bot_identity.py
#    config/risk.yaml       combien engager, quand refuser, où mettre le stop
#                                                 → app/core/risk_gate.py
#    config/data.yaml       ce que le bot regarde (symboles, univers,
#                           fournisseurs)         → app/engine/scanner.py
#    config/lifecycle.yaml  quels bots vivent et avec quel capital
#                                                 → app/live/slot_lifecycle.py
#    config/ops.yaml        API web, logs, base, alertes  → app/api/
#
#  Les PARAMÈTRES DE STRATÉGIES ne sont pas ici : chaque stratégie porte les
#  siens dans `strategies/<nom>.yaml`, avec ses `optimizer_results`.
#
#  ── Règles du découpage ────────────────────────────────────────────────────
#
#  1. Une section YAML vit dans UN SEUL fichier. La déclarer deux fois fait
#     échouer le chargement : sinon l'ordre de lecture déciderait en silence
#     laquelle s'applique.
#  2. L'ordre des `include:` n'a donc aucune importance.
#  3. Les écritures depuis l'UI (budgets, forçages, params optimisés) sont
#     routées vers le fichier propriétaire de la section — cf.
#     `app/core/yaml_io.py::update_config_yaml`. Rien à faire côté appelant.
#  4. Une config monolithique reste valide : sans `include:`, tout peut
#     revenir dans ce fichier. Le chargeur se comporte alors comme avant.
#
#  Vérification rapide de ce qui est effectivement chargé :
#      python -c "from app.core.config import load_config; \
#                 print(sorted(load_config('config.yaml')))"
#
include:
  - config/venues.yaml
  - config/risk.yaml
  - config/data.yaml
  - config/lifecycle.yaml
  - config/ops.yaml
