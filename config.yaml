exchange:
  name: binance
  api_key: ${BINANCE_API_KEY}
  api_secret: ${BINANCE_API_SECRET}
  margin: true
venues:
  default:
  defs:
    spot:
      market_type: spot
      exchange: binance
      max_leverage: 1
    margin-isolated:
      market_type: margin
      exchange: binance
      margin_mode: isolated
      max_leverage: 3
    perp-hedge-okx:
      market_type: perp
      exchange: okx
      hedge_mode: true
      max_leverage: 5
  assign: {}
trading:
  capital: 1000
  paper_mode: true
  timeframe: 1h
  timeframes:
    - 15m
    - 30m
    - 1h
    - 4h
    - 1d
  scan_interval: 60
  score_threshold: 0.55
  risk_per_trade: 0.01
  max_positions: 5
  max_longs: 3
  max_shorts: 3
  max_leverage: 1
  max_trades_per_minute: 3
  daily_drawdown_limit: 0.05
  max_drawdown_global: 0.2
  min_volume_usdc_24h: 5000000
  taker_fee: 0.001
  maker_fee: 0.0004
  spread_pct: 0.0005
  latency_ms: 50
  borrow_rate_daily: 0.00072
  borrow_periods_per_day: 3
  margin_mode: isolated
  margin_level_alert: 1.5
  margin_level_critical: 1.2
  exchange_stop_orders: true
  exchange_stop_limit_offset: 0.005
  reconcile_real_costs: true
  reentry_cooldown_bars: 2
  top_strategies_per_tf: 2
risk:
  veto_mode: enforce
  equity_kill_switch_dd: 0.35
  consecutive_loss_limit: 3
  consecutive_pause_secs: 1800
  slot_daily_dd_limit: 0.03
  win_rate_floor: 0.25
  max_trades_per_day: 5
  volatility_threshold: 0.05
  adx_trend_threshold: 25.0
  atr_volatile_threshold: 3.0
scanner:
  dynamic_scan: false
  symbols:
    - BTC/USDC
    - ETH/USDC
  top_n: 20
  symbols_cache_ttl: 300
  opportunity_scan:
    min_vol_24h_m: 10
    min_atr_pct: 1.0
    max_atr_pct: 10.0
    top_n: 15
derivatives:
  enabled: true
  period: 1h
  refresh_interval: 300
  z_window: 90
backtest:
  spread_pct: 0.0005
  latency_ms: 50
  partial_fill_pct: 0.95
  monte_carlo_runs: 200
  walk_forward_folds: 5
optimizer:
  enabled: false
  method: bayesian
  n_trials: 40
  out_of_sample_ratio: 0.35
forward_test:
  enabled: true
  interval_h: 24
  lookback_days: 45
  edge_lookback_days: 365
  symbol: BTC/USDC
  initial_delay_s: 300
database:
  url: sqlite:///trades.db
capital_allocator:
  mode: performance
  max_slot_pct: 0.5
  per_bot_sizing: false
  reserve_pct: 0.1
  min_notional_usdc: 10.0
  max_budget_step: 0.25
  active_floor: 2
  continuous_allocation: false
  min_trades_for_rebalance: 3
  rebalance_interval: daily
  max_symbol_exposure_pct: 0.25
  max_pyramiding: 2
  disabled_slots: []
  slot_budgets:
    supertrend_macd::15m: 0.0909
    breakout::1h: 0.0909
    derivatives_reversion::1h: 0.0909
    breakout::4h: 0.0909
    supertrend_macd::4h: 0.0909
    volatility_squeeze::1d: 0.0909
    breakout::1d: 0.0909
lifecycle:
  enabled: true
  interval_h: 1
  initial_delay_s: 600
  plancher_budget_pct: 0.02
  trial_min_trades: 3
  active_min_trades: 10
  eval_min_trades: 10
  edge_min_trades: 15
  edge_conf: 0.85
  max_worst_trade_pct: 50.0
  fidelity_min_fills: 2
  manual_active:
    - fft_spectral::1d
    - ml_dynamic_threshold::1h
    - ml_dynamic_threshold::4h
    - multi_tf_sr::1d
    - opus_omnibus_v10_no_ml::1h
    - opus_omnibus_v11::30m
    - opus_omnibus_v12::30m
    - opus_omnibus_v8_no_ml::1h
    - pullback_trend::1h
    - scoring_statistique_opus::1h
    - scoring_statistique_opus_v2::4h
    - snowball_pyramid::1h
    - snowball_pyramid::30m
    - tvr_trend::1h
    - tvr_trend::30m
  min_active_bots: 2
  max_demotions_per_day: 2
  auto_reopt: false
watchdog:
  check_interval_s: 60
  timeout_s: 300
logging:
  level: INFO
  debug: false
  log_file: logs/bot.log
  max_bytes: 10485760
  backup_count: 5
web:
  host: 0.0.0.0
  port: 8000
  refresh_interval: 5
  api_key: ''
ui:
  risk_preset:
  expert_mode: false
notifications:
  telegram_enabled: false
  telegram_bot_token: ''
  telegram_chat_id: ''
  whatsapp_enabled: false
  whatsapp_mode: callmebot
  whatsapp_number: ''
  whatsapp_token: ''
  twilio_account_sid: ''
  twilio_auth_token: ''
  twilio_from_number: ''
  email_enabled: false
  email_smtp: smtp.gmail.com
  email_port: 587
  email_user: ''
  email_password: ''
  email_to: ''
  min_pnl_to_notify: 5.0
  position_loss_warn_pct: 5.0
  exchange_error_threshold: 3
  dd_warning_ratio: 0.8
  throttle_secs: 60
  feed_size: 200
  events:
    on_trade_open: true
    on_trade_close: true
    on_circuit_breaker: true
    on_dd_warning: true
    on_position_loss: true
    on_exchange_error: true
    on_status_report: true
    on_optimization: true
    on_start_stop: true
