# ──────────────────────────────────────────────────────────────────────────────
# Configuration principale du bot
# Les paramètres et résultats d'optimisation des stratégies sont dans strategies/
# ──────────────────────────────────────────────────────────────────────────────

exchange:
  name: binance
  api_key: ${BINANCE_API_KEY}
  api_secret: ${BINANCE_API_SECRET}
  # Trading sur compte margin isolé assumé (emprunt auto AUTO_BORROW_REPAY).
  # Doit rester cohérent avec trading.margin_mode : margin_mode != null active
  # déjà le mode margin (cf. _margin_enabled). Pour revenir en spot pur sans
  # emprunt : margin: false ET trading.margin_mode: null.
  margin: true
# Phase 1 — venues : modèle de marché (spot/margin/perp) + exchange, attribut PAR
# bot. Par défaut, la venue est dérivée des globales trading.margin_mode /
# trading.max_leverage (rétro-compatibilité). Déclarez ici des venues nommées et
# assignez-les par bot (clé "strategy::tf") ; "perp-hedge-okx" servira en Phase 5.
venues:
  default: null                 # null → venue dérivée des globales trading.*
  defs:
    spot:            {market_type: spot,   exchange: binance, max_leverage: 1}
    margin-isolated: {market_type: margin, exchange: binance, margin_mode: isolated, max_leverage: 3}
    perp-hedge-okx:  {market_type: perp,   exchange: okx, hedge_mode: true, max_leverage: 5}
  assign: {}                    # ex : {"breakout::4h": "margin-isolated"}
trading:
  capital: 1000
  paper_mode: true
  timeframe: 1h
  timeframes:
  - 5m
  - 15m
  - 30m
  - 1h
  - 4h
  - 1d
  scan_interval: 60
  score_threshold: 0.55
  risk_per_trade: 0.01
  max_positions: 5
  max_longs: 3
  max_shorts: 3
  max_leverage: 1
  max_trades_per_minute: 3
  daily_drawdown_limit: 0.05
  max_drawdown_global: 0.2
  min_volume_usdc_24h: 5000000
  taker_fee: 0.001
  maker_fee: 0.0004
  spread_pct: 0.0005
  latency_ms: 50
  borrow_rate_daily: 0.00072
  borrow_periods_per_day: 3
  margin_mode: isolated
  margin_level_alert: 1.5           # alerte si margin level < 1.5
  margin_level_critical: 1.2        # HALT trading si margin level < 1.2 (liq. Binance ≈ 1.05)
  # Stop-loss posé côté exchange en miroir du stop logiciel (live uniquement,
  # filet de sécurité si le bot tombe). Ordre STOP_LOSS_LIMIT, limit décalé de
  # exchange_stop_limit_offset sous/sur le stop.
  exchange_stop_orders: true
  exchange_stop_limit_offset: 0.005
  # Après chaque clôture en live : remplace frais/intérêts estimés par les
  # valeurs réelles de l'exchange (fetch_my_trades + interestHistory margin).
  reconcile_real_costs: true
  reentry_cooldown_bars: 2          # V6.1 : 2 bougies de cooldown après une perte
  top_strategies_per_tf: 2
risk:
  # Phase 1 — suppression progressive des vetos globaux. "enforce" (défaut) :
  # max_positions/longs/shorts, anti-spam et pauses CB de slot bloquent les
  # entrées. "shadow" : ils ne bloquent plus mais sont comptés/loggés (mesure
  # d'écart) — honoré uniquement en paper_mode. Le kill-switch global reste actif.
  veto_mode: enforce
  # Phase 3 — kill-switch d'équité PERSISTANT (veto catastrophe). HALT définitif
  # et sticky si l'équité chute de ce % depuis le capital initial. Survit au
  # redémarrage, non levable sans acquittement forcé. 0 = désactivé.
  equity_kill_switch_dd: 0.35
  consecutive_loss_limit: 3
  consecutive_pause_secs: 1800
  slot_daily_dd_limit: 0.03
  win_rate_floor: 0.25
  max_trades_per_day: 5
  volatility_threshold: 0.05
  adx_trend_threshold: 25.0
  atr_volatile_threshold: 3.0
scanner:
  dynamic_scan: false
  symbols:
  - BTC/USDC
  - ETH/USDC
  top_n: 20
  symbols_cache_ttl: 300
  opportunity_scan:
    min_vol_24h_m: 10
    min_atr_pct: 1.0
    max_atr_pct: 10.0
    top_n: 15

# Dérivés accumulés « au fil de l'eau » (comme l'OHLCV) dans data/derivatives/.
# enabled: true → OHLCVCache fetch funding/OI/long-short/taker (gratuit, sans clé)
# et injecte funding_z / oi_change_pct / lsr_z / taker_z dans le df de scoring,
# consommés par la stratégie funding_flow. Dégradation gracieuse si réseau KO.
derivatives:
  enabled: false
  period: 1h
  refresh_interval: 300
  z_window: 90
backtest:
  spread_pct: 0.0005
  latency_ms: 50
  partial_fill_pct: 0.95
  monte_carlo_runs: 200
  walk_forward_folds: 5
optimizer:
  enabled: false
  method: bayesian
  n_trials: 40
  out_of_sample_ratio: 0.35
# Forward-test glissant (Phase 0 — observationnel, zéro impact trading).
# Re-backteste chaque jour les params figés des slots actifs sur données
# fraîches et compare la réalisation live à une fourchette Monte-Carlo glissante.
# Résultats persistés dans data/oos_tracker.json. Cf. app/core/oos_tracker.py.
forward_test:
  enabled: true
  interval_h: 24          # périodicité du re-backtest glissant
  lookback_days: 45       # fenêtre glissante (30–60 j recommandé)
  symbol: BTC/USDC        # paire de référence (alignée sur l'optimiseur)
  initial_delay_s: 300    # délai avant le 1er passage (réchauffe le cache OHLCV)
database:
  url: sqlite:///trades.db
capital_allocator:
  mode: equal                  # equal | manual | performance
  max_slot_pct: 0.50
  # Phase 1 — sizing par bot : chaque bot dimensionne sur SON budget (budget ×
  # levier) au lieu de l'équité globale (fidélité au backtest). False = inchangé.
  per_bot_sizing: false
  # Phase 2 — allocation continue pilotée par le score (calculée en SHADOW :
  # affichée mais pas appliquée). Réserve gardée, notionnel minimal exchange,
  # variation de budget bornée par pas, plancher de bots dotés.
  reserve_pct: 0.10
  min_notional_usdc: 10.0
  max_budget_step: 0.25
  active_floor: 2
  # false = allocation continue calculée en shadow (affichée). true = APPLIQUÉE
  # (graduation shadow → actif, une fois la donnée Phase 0 jugée fiable).
  continuous_allocation: false
  min_trades_for_rebalance: 3
  rebalance_interval: daily
  max_symbol_exposure_pct: 0.25
  max_pyramiding: 2
  disabled_slots: []
  slot_budgets:
    scoring_statistique_opus::15m: 0.0909
    scoring_statistique_opus::30m: 0.0909
    scoring_statistique_opus_v2::30m: 0.0909
    breakout::1h: 0.0909
    breakout::4h: 0.0909
    supertrend_macd::4h: 0.0909
    breakout::1d: 0.0909
    derivatives_reversion::1h: 0.0909
    pullback_trend::1d: 0.0909
    derivatives_reversion::5m: 0.0909
    supertrend_macd::15m: 0.0909
# Phase 2 — cycle de vie des bots (candidat/essai/actif/retiré). Lecture humaine
# de la trajectoire du budget + réalisation live. Transitions lissées (plancher de
# bots actifs + quota de rétrogradations/jour) et persistées en base.
lifecycle:
  enabled: true
  interval_h: 1                 # fréquence de réévaluation des états
  initial_delay_s: 600
  plancher_budget_pct: 0.02     # sous ce budget (avec vécu) → retrait
  trial_min_trades: 3           # < ce nb de trades live → essai
  active_min_trades: 10         # ≥ ce nb + live conforme + score > 0 → actif
  eval_min_trades: 10           # taille d'échantillon mini pour un retrait sur perf
  min_active_bots: 2            # plancher : jamais moins de N bots non-retirés
  max_demotions_per_day: 2      # quota anti-flush de rétrogradations/jour
  # false = la file de re-optimisation des bots retirés est seulement exposée.
  # true = re-optimisation auto déclenchée (ferme la boucle retrait → re-opt).
  auto_reopt: false
# Phase 3 — watchdog dead-man (process SÉPARÉ : `python -m app.live.watchdog`).
# Lit data/heartbeat.json ; si périmé > timeout_s alors que le bot se dit actif,
# arme data/KILL_SWITCH (le bot se met en HALT à son prochain cycle/redémarrage).
watchdog:
  check_interval_s: 60
  timeout_s: 300                # ~5 cycles manqués (scan_interval=60s)
logging:
  level: INFO
  debug: false
  log_file: logs/bot.log
  max_bytes: 10485760
  backup_count: 5
web:
  host: 0.0.0.0
  port: 8000
  refresh_interval: 5
  api_key: ''
# Phase 4 — préférences d'interface (presets de risque, mode expert opt-in).
ui:
  risk_preset: null             # prudent | equilibre | agressif (null = personnalisé)
  expert_mode: false
notifications:
  telegram_enabled: false
  telegram_bot_token: ''
  telegram_chat_id: ''
  whatsapp_enabled: false
  whatsapp_mode: callmebot
  whatsapp_number: ''
  whatsapp_token: ''
  twilio_account_sid: ''
  twilio_auth_token: ''
  twilio_from_number: ''
  email_enabled: false
  email_smtp: smtp.gmail.com
  email_port: 587
  email_user: ''
  email_password: ''
  email_to: ''
  min_pnl_to_notify: 5.0
  position_loss_warn_pct: 5.0
  exchange_error_threshold: 3
  dd_warning_ratio: 0.8
  # Phase 4 — hiérarchie 3 niveaux (info/warning/critical) + throttling + flux UI.
  throttle_secs: 60             # anti-spam : fusionne les messages de même clé
  feed_size: 200                # taille du fil d'activité en mémoire (miroir UI)
  events:
    on_trade_open: true
    on_trade_close: true
    on_circuit_breaker: true
    on_dd_warning: true
    on_position_loss: true
    on_exchange_error: true
    on_status_report: true
    on_optimization: true
    on_start_stop: true
