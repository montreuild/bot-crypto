recipe: omnibus_v4_single
version: 1
description: >
  Recette omnibus single-horizon (t+1) — celle des générations V7/V10 et de
  opus_stat_retrained_v4. Scorer un modèle single-horizon contre des labels
  [1,3,6] mesurait une cible jamais apprise : c'est l'écart 0.732 vs 0.702 qui
  a motivé gate_spec, désormais porté par ce fichier.

features:
  catalog: v4_polars@1
  params: {}

labels:
  horizons: [1]
  amp_top_pct: 0.30

heads: [amp, dir]

hp:
  n_estimators: 500
  num_leaves: 31
  learning_rate: 0.03
  # Déclarés EXPLICITEMENT : la génération V10 n'a jamais calibré ni élagué.
  # Les laisser implicites laissait le backend appliquer ses propres valeurs
  # (True/True), donc entraîner un autre modèle que celui décrit ici.
  calibrate: false
  prune_features: false

window:
  bars:
    default: max
  min_bars: 2000
  cadence_bars: 800

gate:
  metric: auc_amp
  holdout_bars: 1500
  auc_floor: 0.55
  epsilon: 0.01

persistence: lgbm_amp_dir_bundle
