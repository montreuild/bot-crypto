recipe: omnibus_v4_multi
version: 1
description: >
  Recette omnibus multi-horizon — le modèle de la lignée vivante (V11/V12).
  Labellisation sur 3 horizons : capte les mouvements qui se développent sur
  plusieurs bougies, pas seulement le pas suivant.

features:
  catalog: v4_polars@1
  params: {}                      # tout ce qui change les FEATURES vit ici

labels:
  horizons: [1, 3, 6]
  amp_top_pct: 0.30

heads: [amp, dir]

hp:
  n_estimators: 500
  num_leaves: 31
  learning_rate: 0.03
  calibrate: true
  prune_features: true

# ML-11 — surcharges par timeframe, superposées à `hp` ci-dessus et
# PRIORITAIRES sur les paramètres reçus (cf. Recipe.hp_for_tf).
hp_by_tf:
  1h:
    # Mesuré par scripts/measure_calibration_and_pruning.py : la calibration
    # isotone dégrade l'ECE de +461 % en 1h, alors qu'elle l'améliore de
    # −47 % en 15m et −67 % en 30m. La conclusion était écrite depuis
    # longtemps sans jamais être appliquée — cette recette portait
    # `calibrate: true` pour TOUS les TF.
    #
    # Pourquoi 1h et pas les autres : le calibrateur est ajusté sur le set de
    # VALIDATION, et en 1h ce set contient trop peu d'événements positifs pour
    # que l'isotone y apprenne autre chose que sa propre partition. Elle
    # n'ajoute pas du biais, elle recopie du bruit.
    #
    # L'AUC n'est pas concernée : la calibration est monotone, elle ne peut
    # pas changer un classement. Ce qui change est la probabilité affichée —
    # donc les seuils de décision qui la lisent.
    calibrate: false

window:
  bars:
    default: max                  # mesuré : en 1h, moins d'historique fait
                                  # parfois mieux (§1.5) — à balayer par
                                  # window_sweep avant de figer un chiffre.
  min_bars: 2000
  cadence_bars: 800

gate:
  metric: auc_amp
  # 1500 → 1400. Mesuré (cf. §3.7ter du plan directeur) : sur les 120 titres
  # actions du cache, le seuil d'éligibilité au pooling passe de 1750 à 1650
  # barres, ce qui fait entrer 2 titres de plus en journalier (114 → 116).
  #
  # Ce réglage NE débloque PAS le 4h ni le 15m, contrairement à ce qu'on
  # pouvait espérer : le plafond y est celui de Yahoo, pas le nôtre. La
  # rétention est de 60 jours en 15m/30m et de 730 jours en 1h (dont le 4h est
  # ré-agrégé), soit au mieux 1428 barres en 15m et 1445 en 4h — sous le seuil
  # de 1650 quoi qu'il arrive. Aucun backfill ne peut aller les chercher.
  # Débloquer ces TF demanderait un holdout PAR TF (~300), donc un bloc
  # `gate_by_tf` qui n'existe pas : décision ouverte, pas oubli.
  holdout_bars: 1400
  auc_floor: 0.55
  epsilon: 0.01

persistence: lgbm_amp_dir_bundle
