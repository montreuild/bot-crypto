# T-05 : les tests `slow` ne tournent pas dans le CI PR.
# Job hebdomadaire + déclenchement manuel.
name: Slow tests

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run slow tests
        run: python -m pytest tests/ -q --tb=short -m slow
        env:
          CRYPTO_BOT_INLINE_COMPUTE: "1"
