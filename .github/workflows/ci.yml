name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.15.8
      - name: Ruff check
        run: ruff check .

  mypy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Mypy (modules purs)
        run: python -m mypy app/core/sanitize.py app/core/ohlcv_gaps.py app/ml/overfitting_gate.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        # requirements-dev.txt porte pytest et l'outillage depuis qu'ils ont
        # été sortis de l'image de production (cf. Dockerfile, cible `test`).
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short -m "not slow"
          --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=25

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      # `--ignore-vuln GHSA-xxxx` était un identifiant placeholder : il ne
      # masquait rien et laissait croire qu'une exception était en place.
      # Toute exception future doit porter un vrai identifiant PYSEC/GHSA et la
      # raison de son acceptation.
      - name: Audit dependencies for CVEs
        # Les deux fichiers : une CVE dans l'outillage de dev reste une CVE du
        # dépôt, même si elle ne part pas en production.
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      # S10 — Les tests unitaires du frontend (Vitest) n'étaient joués nulle
      # part en CI : la suite livrée en S2 échouait à 7/9 sans que rien ne
      # l'attrape. Elle couvre aussi désormais les contrats d'API (zod), dont
      # l'écart avait fait planter /ml et le drawer de /bots-v2.
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # S6-13 — Filet de la migration Jinja2 → Next.js : garantit qu'aucune des 20
  # routes migrées ne casse silencieusement. On ne joue que les smoke tests de
  # chargement (`loads` / `redirige`) : depuis S6-12, ils passent backend
  # éteint (titre monté + état d'erreur), donc pas besoin de FastAPI en CI.
  # Les tests KPI/recherche, eux, exigent des données et restent hors CI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: frontend/e2e
        run: npm install
      - name: Install Playwright browser
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: npm run start &
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 60000
      # S10 — « reste accessible » couvre les routes volontairement NON
      # redirigées : leur perte serait invisible autrement (les onglets des
      # pages méta y renvoient explicitement).
      # « monte le contenu » vérifie l'inverse pour les onglets fusionnés : une
      # 308 vers un onglet vidé de son contenu passerait « redirige » sans que
      # rien ne le signale.
      - name: Page-loading smoke tests
        working-directory: frontend/e2e
        run: npx playwright test --grep "loads|redirige|reste accessible|monte le contenu"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7

  # S10-F2 — Accessibilité WCAG 2.1 AA sur les 24 pages, dont les 5 pages méta
  # de la refonte qui n'étaient couvertes par rien.
  #
  # Bloquant : le premier relevé remontait 52 violations sur 5 règles
  # (color-contrast, select-name, label, button-name,
  # scrollable-region-focusable) ; elles sont toutes traitées, le job passe à
  # zéro violation. Il protège donc désormais d'une régression réelle.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: frontend/e2e
        run: npm install
      - name: Install Playwright browser
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: npm run start &
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: axe-core WCAG 2.1 AA
        working-directory: frontend/e2e
        run: npx playwright test a11y.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: frontend/e2e/playwright-report/
          retention-days: 7

  # S10-F1 — Régression visuelle (substitut à Chromatic/Storybook, cf.
  # e2e/tests/visual.spec.ts pour la justification).
  #
  # Bloquant : les références Linux des 5 pages méta sont commitées sous
  # `e2e/tests/visual.spec.ts-snapshots/`. Elles ont été générées par ce job
  # même — une baseline produite sous Windows ne vaut pas ici (rendu des
  # polices différent). Pour les régénérer après un changement visuel
  # volontaire : relancer avec `--update-snapshots` et committer l'artefact.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: frontend/e2e
        run: npm install
      - name: Install Playwright browser
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: npm run start &
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Screenshots de référence
        working-directory: frontend/e2e
        run: npx playwright test visual.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: |
            frontend/e2e/tests/visual.spec.ts-snapshots/
            frontend/e2e/playwright-report/
          retention-days: 14
