name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.15.8
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short -m "not slow"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for CVEs
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-xxxx  # placeholder for known false positives

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # S6-13 — Filet de la migration Jinja2 → Next.js : garantit qu'aucune des 20
  # routes migrées ne casse silencieusement. On ne joue que les smoke tests de
  # chargement (`loads` / `redirige`) : depuis S6-12, ils passent backend
  # éteint (titre monté + état d'erreur), donc pas besoin de FastAPI en CI.
  # Les tests KPI/recherche, eux, exigent des données et restent hors CI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: frontend/e2e
        run: npm install
      - name: Install Playwright browser
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: npm run start &
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Page-loading smoke tests
        working-directory: frontend/e2e
        run: npx playwright test --grep "loads|redirige"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7
