# ──────────────────────────────────────────────────────────────────────────────
# Stratégie : Smart Trend ADX  (portage du PineScript « BTC Smart Trend V6 »)
# ──────────────────────────────────────────────────────────────────────────────
# Pullback mean-reversion filtré par tendance : on achète un repli dans la bande
# basse de Bollinger EN tendance haussière (close > EMA200) quand la tendance est
# FORTE (ADX > seuil) et le RSI bas, avec une bougie de confirmation. Miroir en
# short. Sortie par bracket FIXE (pas de trailing) : SL = 1.2×ATR, TP = 2.5×ATR.
#
# Référence TradingView (BTC, 1 janv. 2024 → 1 juil. 2026) fournie par l'auteur :
#   PnL +19 %, 63 trades, 16 gagnants, profit factor 1.451, commission 0.05 %/côté,
#   100 % de l'équité par trade.
#   → Voir research/backtest_smart_trend.py pour le backtest local sur parquet et
#     research/RESULTATS_smart_trend_adx.md pour la comparaison chiffrée.

params:
  ema_len: 200
  bb_len: 20
  bb_mult: 2.0
  rsi_len: 14
  rsi_long: 40
  rsi_short: 60
  adx_len: 14
  adx_thresh: 20
  atr_len: 14
  sl_mult: 1.2
  tp_mult: 2.5
  score_threshold: 0.5
