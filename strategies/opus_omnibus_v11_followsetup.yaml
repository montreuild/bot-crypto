params:
  # ── Session 24/7 ───────────────────────────────────────────────────────────
  # Aucun filtre horaire ni jours actifs : on suit les setups en continu.
  enable_hour_filter: false

  adx_threshold: 20

  # ── Pas de TP, pas de trailing, SL très large = filet de sécurité ──────────
  # Le moteur de backtest a besoin d'un stop pour dimensionner la position
  # (size = risk / stop_dist). On garde donc un SL "safety net" largement
  # au-delà du bruit, qui n'est censé jamais être touché en pratique. Les
  # sorties effectives sont pilotées par check_early_exit (flip de setup).
  safety_sl_atr_mult: 10.0
  disable_trailing: true
  use_fixed_tp: false

  # ── Anti-whipsaw sur les flips de setup ────────────────────────────────────
  # K bougies consécutives où un setup opposé qualifie avant de flipper.
  flip_confirm_bars: 2
  # Gel des entrées pendant N bougies après un flip (anti-thrash).
  flip_cooldown_bars: 5
  # Score minimum requis sur le setup cible pour valider le flip.
  flip_min_score: 0.55
  # Marge ajoutée à dir_max / dir_min pour exiger un signal plus net.
  flip_hysteresis_margin: 0.05

  # ── Garde-fou temps maxi ouvert (limite borrow_cost si pas de flip) ────────
  max_bars_safety: 200

  # ── Pas d'exit_td_window, pas de signal_up dynamique ──────────────────────
  signal_up_dynamic_risk: false

  bearish_excess_rsi_threshold: 38.0
  bearish_excess_sma_pct: 1.5

  # ── ML (multi-horizon + calibration conservés, importance/pruning OFF) ─────
  label_horizons: [1, 3, 6]
  calibrate: true
  prune_features: false
  di_rescue: 10.0
  log_training: true

  # ── Entraînement inline (LightGBM amp/dir) ─────────────────────────────────
  amp_top_pct: 0.30
  warmup_bars: 750
  retrain_every: 800
  n_estimators: 500
  num_leaves: 31
  learning_rate: 0.03

  # ── SIGNAL_UP ──
  setup_signal_up_enabled: true
  setup_signal_up_priority: -1
  setup_signal_up_amp_min: 0.50
  setup_signal_up_dir_min: 0.60
  setup_signal_up_size_factor: 1.0

  # ── SHORT_TD_HIGH ──
  setup_short_td_high_enabled: true
  setup_short_td_high_priority: 0
  setup_short_td_high_amp_min: 0.60
  setup_short_td_high_dir_max: 0.30
  setup_short_td_high_size_factor: 1.0

  # ── LONG_CHOPPY / SHORT_CHOPPY ──
  setup_long_choppy_enabled: true
  setup_long_choppy_priority: 2
  setup_long_choppy_amp_min: 0.50
  setup_long_choppy_dir_min: 0.58

  setup_short_choppy_enabled: true
  setup_short_choppy_priority: 2
  setup_short_choppy_amp_min: 0.50
  setup_short_choppy_dir_max: 0.42

  # ── LONG_TU (V10 strict) ──
  setup_long_tu_enabled: true
  setup_long_tu_priority: 3
  setup_long_tu_amp_min: 0.55
  setup_long_tu_dir_min: 0.62
  setup_long_tu_needs_adx_above: 25.0

  # ── LONG_RANGE_STRICT ──
  setup_long_range_strict_enabled: true
  setup_long_range_strict_priority: 5
  setup_long_range_strict_amp_min: 0.60
  setup_long_range_strict_dir_min: 0.60

  # ── LONG_RANGE_LIGHT ──
  setup_long_range_light_enabled: true
  setup_long_range_light_priority: 6
  setup_long_range_light_amp_min: 0.50
  setup_long_range_light_dir_min: 0.55
  setup_long_range_light_size_factor: 1.0

  score_threshold: 0.55

optimizer_results:
