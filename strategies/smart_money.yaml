# ──────────────────────────────────────────────────────────────────────────────
# Stratégie : Smart Money Concepts (SMC)
# ──────────────────────────────────────────────────────────────────────────────
# Basée sur le moteur d'analyse app/core/smc.py : structure de marché
# (BOS/CHoCH), poches de liquidité (equal highs/lows), sweeps, order blocks
# (offre/demande), FVG, premium/discount et OTE.
#
# Architecture :
#   - app/core/smc.py          → structures (inchangé)
#   - trade_plans / Smart Graph → affichage analytique (inchangé)
#   - smart_money_signals      → ordres : sous-ensemble de setups + filtres
#                                choisis par optimisation long terme
#
# Sélection setups (ablation / OOS BTC 2018→2026) :
#   ✅ use_sweep_reversal   SWEEP_REVERSAL  — cœur edge
#   ✅ use_ob_retest        OB_RETEST       — cœur edge
#   ❌ use_breakers         BREAKER_RETEST  — −163 USDC / 220 trades 4h
#   ❌ use_rejection_blocks REJECTION_RETEST — dilue le PF global
#   ❌ use_bpr              BPR_REVERSAL    — off (pas d'edge stable)
#   ❌ calendar sweeps      use_calendar_liquidity — off par défaut
#
# Filtres de signaux optimisés (PARAM_SPACE) : min_score, min_rr, min_gain_pct,
# chop_filter_max, htf_filter, require_inducement, kz/amd/vp bonuses, trailing…
# Les meilleurs jeux par TF sont dans optimizer_results (IS 2/3 · OOS 1/3).
#
# Validation BTC/USDC (2026-07, htf_filter soft, frais 0.1 %/côté) :
#   4h : SEUL TF tradable (oos_score +0.37) — min_score 0.70, RR≥2, chop<61.8
#   15m/30m/1h/1d : oos_score négatif → configs « moins mauvaises » (lifecycle
#        ne les promouvra pas). 2h retiré (non collecté).
#
# Timeframes Strategy : 15m, 30m, 1h, 4h, 1d.

params:
  swing_len: 3            # pivots fractals : N barres de chaque côté
  eq_tol_atr: 0.25        # tolérance equal highs/lows (×ATR)
  disp_body_atr: 1.3      # corps minimal du displacement (×ATR)
  ob_lookback: 5          # recherche de la bougie opposée avant l'impulsion
  fvg_min_atr: 0.2        # taille minimale d'un FVG (×ATR)
  min_gain_pct: 0.4       # ⚠ gain potentiel minimal en % (filtre des positions)
  min_rr: 1.2             # ratio gain/risque minimal
  sl_buffer_atr: 0.25     # marge du stop sous/sur la zone (×ATR)
  tp_rr_fallback: 2.0     # TP fallback en multiples de R
  tp_front_run_atr: 0.1   # TP posé juste avant la poche visée (×ATR)
  vol_confluence: 1.2     # bonus si volume > 1.2× SMA20(volume)
  choch_guard_bars: 5     # pas d'entrée contre un CHoCH plus récent que N barres
  ema_filter_len: 200     # biais institutionnel : long > EMA200, short < EMA200 (0 = off)
  choch_exit: false       # early-exit CHoCH : négatif sur BTC toutes TF (validation 2026-07)
  # ── Setups retenus (sélection long terme) ────────────────────────────────
  use_sweep_reversal: true
  use_ob_retest: true
  use_breakers: false     # BREAKER_RETEST : négatif sur BTC 4h
  use_rejection_blocks: false
  use_bpr: false
  use_calendar_liquidity: false
  use_void_targets: true  # bords des liquidity voids non comblés comme cibles TP
  tl_tol_atr: 0.3         # tolérance du tap de trendline automatique (×ATR)
  # ── Filtres / enrichissements (base ; surchargés par optimizer_results) ──
  htf_filter: soft        # ✅ biais multi-TF gagnant sur tous les TF
  htf_mult: 4             # HTF = timeframe × 4 (1h→4h, 4h→16h…)
  vp_confluence: false
  vp_targets: false
  kz_bonus: false
  kz_filter: false
  amd_bonus: false
  time_stop_bars: 0
  score_threshold: 0.55   # seuil engine (≥ 1 confluence, score base 0.50)
  min_score: 0.0          # seuil interne setup (0 = délègue à score_threshold)

# ── Configurations par timeframe (calibration 2026-07-04) ────────────────────
# Méthode : grille ciblée par TF (seuil de score avec bonus kz/amd/vp actifs,
# min_rr, sl_buffer/min_gain, rejections/kz_filter), split IS 2/3 / OOS 1/3
# (l'OOS = 2024-2026, la période la plus difficile). Sélection : ≥10 trades
# OOS ET PF IS ≥ 1.0, classement par PF OOS. oos_score = composite_score du
# repo calculé sur un backtest propre de la tranche OOS (warmup 260 barres).
#
# Lecture senior : SEUL LE 4H EST TRADABLE (oos_score positif). Les autres TF
# sont enregistrés avec leur meilleure config « la moins mauvaise » et un
# score NÉGATIF assumé — le lifecycle/audit ne les promouvra pas ; si vous
# forcez un de ces TF, la config limite au moins l'hémorragie (ex. 1h :
# OOS −34 avec la config vs −182 avec les défauts).
optimizer_results:
  4h:
    run_date: '2026-07-08'
    oos_score: 0.3718
    # TRAILING + SIZING + FILTRE CHOPPINESS + CONFIRMATION BOUGIE (2026-07-08).
    # 1) Trailing 3.5×ATR (TrailingStopManager) : laisse COURIR les gagnants ;
    #    time-stop 12 CONDITIONNEL (coupe seulement les stagnants).
    # 2) Sizing par confluence (size_factor = 1 + 3×(score − 0.83), [0.4,1.7]),
    #    centré sur le score moyen ⇒ exposition ≈ inchangée.
    # 3) Filtre Choppiness < 61.8 : ne trade QU'hors congestion (croisement
    #    indicateur × SMC — l'idée « OB en tendance, pas en chop »).
    # 4) Confirmation bougie : bonus +0.05 si pin bar / engulfing dans le sens
    #    → via le sizing, monte les setups confirmés (qualité par trade élevée).
    # Mesuré (vrai Backtester, chemin de prod), empilement :
    #   trailing+sizing        FULL +387 PF 1.51 Sh 5.2 | OOS +108 PF 1.46 sc 0.332
    #   + choppiness<61.8      FULL +483 PF 1.69 Sh 6.7 | OOS +117 PF 1.51 sc 0.359
    #   + confirmation bougie  FULL +503 PF 1.72 Sh 6.8 | OOS +129        sc 0.372
    # Choppiness et confirmation bougie améliorent TOUT sur les deux périodes à
    # nombre de trades quasi constant (137/51) — croisements indicateurs gagnants.
    # 5) Inducement (SMC-11, 2026-07-12) : retest d'OB/breaker accepté seulement
    #    si un sweep rejeté opposé a eu lieu ≤ 12 barres avant l'origine de la
    #    zone (prise de liquidité = crédibilité du move). Mesuré sur ce slot :
    #    IS PF 2.19 → 2.71, OOS +68.2 → +75.4 (PF 1.47 → 1.88, WR 36.5 → 43.8)
    #    avec 38 % de trades en moins (52 → 32 OOS) — sélectivité pure.
    #    (ETH : IS s'améliore mais OOS se dégrade → PAS activé ailleurs.)
    params:
      # Setups : cœur uniquement (sweep + OB)
      use_sweep_reversal: true
      use_ob_retest: true
      use_breakers: false
      use_rejection_blocks: false
      use_bpr: false
      # Filtres optimisés OOS
      min_score: 0.70
      min_rr: 2.0
      sl_buffer_atr: 0.5
      time_stop_bars: 12
      use_trailing: true
      trail_mult: 3.5
      size_by_confluence: true
      size_conf_slope: 3.0
      chop_filter_max: 61.8
      candle_bonus: true
      kz_bonus: true
      amd_bonus: true
      vp_confluence: true
      require_inducement: true
      inducement_lookback: 12
  # 2h retiré — non collecté / non activé dans trading.timeframes
  1d:
    run_date: '2026-07-04'
    oos_score: -0.0747
    # OOS : 12 trades, −37, PF 0.587 — trop peu de trades, pas d'edge.
    params:
      use_sweep_reversal: true
      use_ob_retest: true
      use_breakers: false
      use_rejection_blocks: false
      use_bpr: false
      min_score: 0.55
      min_rr: 1.2
      sl_buffer_atr: 0.5
      kz_bonus: true
      amd_bonus: true
      vp_confluence: true
  1h:
    run_date: '2026-07-08'
    oos_score: -0.0206
    # NON tradable. Sélectivité max (score/RR/chop) pour limiter l'hémorragie.
    params:
      use_sweep_reversal: true
      use_ob_retest: true
      use_breakers: false
      use_rejection_blocks: false
      use_bpr: false
      min_score: 0.65
      min_rr: 2.0
      min_gain_pct: 1.2
      kz_filter: true
      kz_bonus: true
      amd_bonus: true
      vp_confluence: true
      chop_filter_max: 50.0
  30m:
    run_date: '2026-07-08'
    oos_score: -0.0976
    # NON tradable — filtres durs.
    params:
      use_sweep_reversal: true
      use_ob_retest: true
      use_breakers: false
      use_rejection_blocks: false
      use_bpr: false
      min_score: 0.75
      min_rr: 1.5
      min_gain_pct: 1.2
      kz_filter: false
      kz_bonus: true
      amd_bonus: true
      vp_confluence: true
      chop_filter_max: 50.0
  15m:
    run_date: '2026-07-08'
    oos_score: -0.0452
    # NON tradable (bruit + frais).
    params:
      use_sweep_reversal: true
      use_ob_retest: true
      use_breakers: false
      use_rejection_blocks: false
      use_bpr: false
      min_score: 0.65
      min_rr: 1.5
      min_gain_pct: 1.2
      kz_filter: true
      kz_bonus: true
      amd_bonus: true
      vp_confluence: true
      chop_filter_max: 50.0
