# SMC ML Edge — consomme la recette `omnibus_smc` (catalogue v5_smc@1).
#
# Les valeurs ci-dessous sont des POINTS DE DÉPART, pas des réglages mesurés.
# Contrairement à la recette — dont chaque valeur porte son ablation — les
# seuils de décision d'une stratégie ne se mesurent que par backtest, et le
# backtest de référence est dans `docs/STRATEGY_SMC_ML_EDGE.md`.

models:
  # Rebrancher la stratégie sur une autre recette se fait ICI, sans toucher au
  # code (cf. `app.ml.recipe.strategy_models`). `omnibus_smc_tb` est utilisable
  # pour comparer, en gardant à l'esprit que sa 3ᵉ tête n'est pas persistée.
  signal: omnibus_smc

params:
  # ── Porte 1 : amplitude ───────────────────────────────────────────────────
  # Part des barres retenues, PAS un seuil de probabilité. Un seuil absolu ne
  # marche pas ici : la tête `amp` cible le top 20 %, donc ses sorties tournent
  # autour de 0.35 et non de 0.5 (mesuré sur BTC/USDC 1h : min 0.10, max 0.67).
  # « Top 10 % » garde son sens quel que soit le symbole ou le réentraînement.
  amp_top_q: 0.10

  # ── Porte 2 : direction ───────────────────────────────────────────────────
  # Idem : `p_up` ne s'étale que de 0.398 à 0.599. Un écart minimal de 0.12 à
  # 0.5 — valeur d'apparence raisonnable — ne laissait passer AUCUNE barre.
  # On prend les 20 % de barres où le modèle est le plus tranché.
  dir_top_q: 0.20

  # ── Porte 3 : structure ───────────────────────────────────────────────────
  # À mesurer par ablation : le modèle voit DÉJÀ les colonnes SMC, donc rien ne
  # garantit qu'un filtre dur par-dessus ajoute quoi que ce soit — il peut ne
  # faire que retirer des trades.
  use_smc_filter: true
  pd_long_max: 0.75
  pd_short_min: 0.25

  # ── Gestion de position ───────────────────────────────────────────────────
  # MESURÉ, et c'est le réglage qui a le plus compté. La valeur initiale de
  # 1.5 ATR — choisie par analogie avec les barrières du schéma
  # `triple_barrier` — coupait les positions avant leur cible sur LES DEUX
  # symboles. C'était la vraie cause de l'écart BTC/ETH, pas un besoin de
  # paramétrage par actif.
  #
  #   symbole   PnL 1.5 → 2.5      profit factor    taux de réussite
  #   BTC       +5.98 % → +9.18 %    1.81 → 6.45      59.1 % → 78.9 %
  #   ETH       −3.07 % → −0.05 %    0.78 → 0.99      43.3 % → 61.1 %
  #
  # ⚠ 18 à 30 trades par configuration, et BTC/ETH corrèlent à 0.835 sur les
  # rendements horaires : ce n'est PAS une réplication indépendante. Le sens de
  # l'effet est cohérent sur tous les axes ; son amplitude ne l'est pas.
  sl_atr_mult: 2.5
  tp_atr_mult: 2.5
  max_hold_bars: 12
  min_size_factor: 0.4

# ─────────────────────────────────────────────────────────────────────────────
#  Paramétrage par symbole et par timeframe
# ─────────────────────────────────────────────────────────────────────────────
# Le mécanisme EXISTE déjà et n'a rien demandé de neuf : un bloc
# `optimizer_results:` indexé par timeframe puis par symbole est superposé aux
# `params:` ci-dessus par `app.core.param_resolution.resolve_strategy_params`,
# empruntée à l'identique par le backtest et par le live. La forme est :
#
#   optimizer_results:
#     1h:
#       BTC/USDC: {run_date: "...", oos_score: ..., params: {sl_atr_mult: 3.0}}
#       ETH/USDC: {run_date: "...", oos_score: ..., params: {max_hold_bars: 24}}
#     30m:
#       XRP/USDC: {run_date: "...", oos_score: ..., params: {...}}
#
# AUCUN bloc n'est écrit ici, DÉLIBÉRÉMENT. Le balayage a bien donné un
# meilleur réglage par symbole (BTC préfère le stop large, ETH la détention
# longue), mais deux mesures interdisent d'en faire des overrides :
#
#   - BTC et ETH corrèlent à 0.835 : ce sont deux vues d'un même processus,
#     pas deux échantillons indépendants ;
#   - les modèles se TRANSFÈRENT d'un symbole à l'autre presque sans perte
#     (le modèle BTC obtient 0.6767 d'AUC amp sur ETH contre 0.6652 pour celui
#     d'ETH), donc il n'y a pas d'effet « personnalité du symbole » à capter.
#
# Écrire des overrides sur ~20 trades reviendrait à figer du bruit dans un
# fichier versionné. Le mécanisme est là quand une mesure le justifiera.

  # ── Modèle ────────────────────────────────────────────────────────────────
  # `warmup_bars` doit rester ≥ `min_bars` de la recette (2000) : en dessous,
  # 464 features n'ont pas de quoi s'estimer.
  warmup_bars: 3000
  retrain_every: 800
  train_window: 20000
