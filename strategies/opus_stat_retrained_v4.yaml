params:
  # ── Seuils de décision (mêmes défauts que la version pré-entraînée §6.4) ──
  thresh_amp_td: 0.50
  thresh_dir_td: 0.10
  thresh_amp_other: 0.55
  thresh_dir_other: 0.13
  adx_threshold: 20

  # ── Filtre temporel V4 (session US, Lun-Ven) ──
  enable_hour_filter: true
  active_hours_utc: [13, 14, 15, 16, 17, 18, 19, 20]
  active_days: [0, 1, 2, 3, 4]

  # ── Gestion SL/TP par régime (risk.py V4) ──
  sl_atr_mult_td: 1.8
  sl_atr_mult_other: 1.5
  tp_atr_mult_td: 1.2
  tp_atr_mult_other: 1.0
  use_fixed_tp: true
  disable_trailing: true
  use_exit_after_bars: false
  max_hold_bars: 4

  # ── Sizing demi-Kelly (risk.py V4) ──
  use_kelly_sizing: true
  kelly_size_other: 0.5
  min_confidence: 0.2

  # ── Hyperparamètres d'entraînement (méthodologie 13_v4_models.py) ──
  # Quantile cut-off pour labéliser un "événement" (top X% des |return_t+1|)
  amp_top_pct: 0.30
  # Walk-forward : retrain inline toutes les retrain_every barres si pas
  # géré externellement par MLStrategyTrainer
  warmup_bars: 2000
  retrain_every: 800
  # LightGBM
  n_estimators: 500
  num_leaves: 31
  learning_rate: 0.03
  # Intervalle de réentraînement (heures) côté MLStrategyTrainer
  retrain_interval_h: 6

  score_threshold: 0.55

