params:
  # ── Filtre temporel V6.1 (session US, Lun-Ven) ──
  enable_hour_filter: true
  active_hours_utc: [13, 14, 15, 16, 17, 18, 19, 20]
  active_days: [0, 1, 2, 3, 4]

  adx_threshold: 20
  exit_td_window_bars: 3

  # ── Gestion exit (V6.1 : SL fixe, TP fixe, max_bars par setup) ──
  disable_trailing: true
  use_fixed_tp: true

  # ── Setup 1 : SHORT_TD (priorité 1) ──
  setup_short_td_enabled: true
  setup_short_td_priority: 1
  setup_short_td_amp_min: 0.50
  setup_short_td_dir_max: 0.40
  setup_short_td_tp_mult: 1.2
  setup_short_td_sl_mult: 1.6
  setup_short_td_max_bars: 8

  # ── Setup 2a : SHORT_CHOPPY (priorité 2) ──
  setup_short_choppy_enabled: true
  setup_short_choppy_priority: 2
  setup_short_choppy_amp_min: 0.50
  setup_short_choppy_dir_max: 0.45
  setup_short_choppy_tp_mult: 1.0
  setup_short_choppy_sl_mult: 1.4
  setup_short_choppy_max_bars: 6

  # ── Setup 2b : LONG_CHOPPY (priorité 2) ──
  setup_long_choppy_enabled: true
  setup_long_choppy_priority: 2
  setup_long_choppy_amp_min: 0.50
  setup_long_choppy_dir_min: 0.55
  setup_long_choppy_tp_mult: 1.0
  setup_long_choppy_sl_mult: 1.4
  setup_long_choppy_max_bars: 6

  # ── Setup 3 : LONG_EXIT_TD (priorité 3) ──
  setup_long_exit_td_enabled: true
  setup_long_exit_td_priority: 3
  setup_long_exit_td_amp_min: 0.40
  setup_long_exit_td_tp_mult: 1.2
  setup_long_exit_td_sl_mult: 1.5
  setup_long_exit_td_max_bars: 8

  # ── Setup 4 : LONG_RANGE_STRICT (priorité 4) ──
  setup_long_range_strict_enabled: true
  setup_long_range_strict_priority: 4
  setup_long_range_strict_amp_min: 0.60
  setup_long_range_strict_dir_min: 0.60
  setup_long_range_strict_tp_mult: 0.8
  setup_long_range_strict_sl_mult: 1.2
  setup_long_range_strict_max_bars: 6

  # ── Hyperparamètres d'entraînement V4 (méthodologie 13_v4_models.py) ──
  amp_top_pct: 0.30
  warmup_bars: 2000
  retrain_every: 800
  n_estimators: 500
  num_leaves: 31
  learning_rate: 0.03
  retrain_interval_h: 6

  score_threshold: 0.55

optimizer_results:
  15m:
    run_date: null
    oos_score: null
    params: {}
  30m:
    run_date: null
    oos_score: null
    params: {}
  1h:
    run_date: null
    oos_score: null
    params: {}
