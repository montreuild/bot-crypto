# ──────────────────────────────────────────────────────────────────────────────
# Stratégie : Momentum Blitz  (AGRESSIVE — plein capital, let-it-run)
# ──────────────────────────────────────────────────────────────────────────────
# Pendant agressif de harmonic_regime. Conçue à partir de
# research/analysis_aggressive.py + research/STRATEGIE_momentum_blitz.md.
#
# Edges exploités (mesurés, nets de frais) :
#   • Ignition = breakout Donchian + surge de volume + expansion d'ATR + HTF aligné.
#     Net-positif seulement à partir de 4h (1h/30m/15m perdent : frais > edge).
#   • Asymétrie MFE/MAE≈1.24, queue droite +6% → stop serré + trailing LARGE.
# Agression = déploiement PLEIN CAPITAL (size_factor 1.0→2.0 selon conviction) +
# exits asymétriques (couper vite / laisser courir) + seuil de qualité bas.
#
# Backtest 7.5 ans (4h, frais/spread/borrow réalistes) :
#   • full1x  : +58.2% · Sharpe 5.73 · maxDD -11.6% · PF 1.55 · win 57%
#   • lev2x   : +113.7% (x2.14) · Sharpe 6.95 · maxDD -12.3% · PF 1.74
#   • BEAR 2022 : flat (-1.6%) vs Buy&Hold -53% ; BULL 23-24 +31.6% ; CHOP +6.4%
#   • Walk-forward OOS : pnl moyen +87, consistance 60%, Sharpe OOS +1.69
#
# ⚠️  RISQUE ASSUMÉ : stratégie agressive (DD ~12-22% selon levier). Le rendement
#     absolu se règle via le déploiement :
#       - full1x : trading.risk_per_trade=0.01 + backtest.max_notional_pct=0.50
#       - lev2x  : max_notional_pct=1.0 (compte margin, levier ~2x)
#     ⚠️  TF d'exécution = 4h UNIQUEMENT. 1h/30m/15m backtestés NÉGATIFS
#         (l'edge breakout < coût round-trip + bruit). Ne pas exécuter < 4h.

params:
  donchian: 30
  vol_surge_min: 1.8
  adx_min: 15
  sl_atr_long: 1.6
  sl_atr_short: 1.0
  trail_wide: 2.5
  tight_r: 5.0
  max_hold: 24
  min_quality: 0.6
  max_size_factor: 1.5
  enable_short: false
  enable_continuation: true
  require_htf: true
  cooldown: 2
  score_threshold: 0.55
