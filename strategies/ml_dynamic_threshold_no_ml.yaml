# Seuil dynamique — variante SANS ML (proxy directionnel).
# Jumeau déterministe de ml_dynamic_threshold : même filtre de régime ADX, mêmes
# seuils de décision proba_long/proba_short, mais proba_up est un proxy
# directionnel d'indicateurs (RSI, momentum, croisements EMA, MACD, VWAP) au lieu
# d'un RandomForest/LogReg. L'esprit "seuil dynamique" est conservé via une porte
# de volatilité (le mouvement récent doit dépasser vol_20·sqrt(lookahead)·vol_mult).
# Aucun random search, aucun modèle persistant.
enabled: true

params:
  lookahead: 3
  vol_multiplier: 0.6
  adx_min: 20.0
  proba_long: 0.60
  proba_short: 0.40
  # Gain de la sigmoïde du proxy directionnel.
  gain: 2.2

  score_threshold: 0.55

optimizer_results:
  5m:
    run_date: null
    oos_score: null
    params: {}
  15m:
    run_date: null
    oos_score: null
    params: {}
  1h:
    run_date: null
    oos_score: null
    params: {}
