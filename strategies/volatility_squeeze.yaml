  # de trades exploitable, shorts autorisés (positifs sur 1d). Plus clairsemé.
  1d:
    run_date: '2026-06-03'
    oos_score: 10.2           # walk-forward 5 folds : PnL OOS moyen (USDC), consistance 60%
    params:
      squeeze_lookback: 80
