# ──────────────────────────────────────────────────────────────────────────────
# Stratégie : Liquidity Sweep Vol  (portage du PineScript « BTC Liquidity Sweep V7 »)
# ──────────────────────────────────────────────────────────────────────────────
# Sweep de liquidité confirmé par le volume : la mèche perce la Bollinger (bande
# basse en tendance haussière), la bougie clôture DANS la bande (rejet) avec un
# volume > 1.5× la moyenne (smart money). Miroir en short. Sortie par bracket
# FIXE (pas de trailing) : SL = 1.5×ATR, TP = 3.0×ATR.
#
# Référence TradingView (BTC, 4h, 1 janv. 2024 → 1 juil. 2026) fournie par l'auteur :
#   PnL +33.49 %, 75 trades, 18 gagnants, profit factor 1.542, commission 0.05 %/côté,
#   100 % de l'équité par trade.
#   → Voir research/backtest_pine.py et research/RESULTATS_liquidity_sweep_vol.md.

