params:
  enable_hour_filter: true
  active_hours_utc: [13, 14, 15, 16, 17, 18, 19, 20]
  active_days: [0, 1, 2, 3, 4]

  adx_threshold: 20
  exit_td_window_bars: 3

  disable_trailing: true
  use_fixed_tp: true

  bearish_excess_rsi_threshold: 38.0
  bearish_excess_sma_pct: 1.5

  # V10 : sizing/SL dynamiques pour SIGNAL_UP selon régime
  signal_up_dynamic_risk: true

  # ── Entraînement inline (LightGBM amp/dir, cf. opus_omnibus_v7) ──
  amp_top_pct: 0.30
  warmup_bars: 750
  retrain_every: 800
  n_estimators: 500
  num_leaves: 31
  learning_rate: 0.03

  # ── SIGNAL_UP ──
  setup_signal_up_enabled: true
  setup_signal_up_priority: -1
  setup_signal_up_amp_min: 0.50
  setup_signal_up_dir_min: 0.60
  setup_signal_up_tp_mult: 1.0
  setup_signal_up_sl_mult: 1.3
  setup_signal_up_max_bars: 6
  setup_signal_up_size_factor: 1.0

  # ── SHORT_TD_HIGH ──
  setup_short_td_high_enabled: true
  setup_short_td_high_priority: 0
  setup_short_td_high_amp_min: 0.60
  setup_short_td_high_dir_max: 0.30
  setup_short_td_high_tp_mult: 1.4
  setup_short_td_high_sl_mult: 1.6
  setup_short_td_high_max_bars: 8
  setup_short_td_high_size_factor: 1.5

  # ── LONG_CHOPPY / SHORT_CHOPPY ──
  setup_long_choppy_enabled: true
  setup_long_choppy_priority: 2
  setup_long_choppy_amp_min: 0.50
  setup_long_choppy_dir_min: 0.58
  setup_long_choppy_tp_mult: 0.9
  setup_long_choppy_sl_mult: 1.2
  setup_long_choppy_max_bars: 10

  setup_short_choppy_enabled: true
  setup_short_choppy_priority: 2
  setup_short_choppy_amp_min: 0.50
  setup_short_choppy_dir_max: 0.42
  setup_short_choppy_tp_mult: 1.2
  setup_short_choppy_sl_mult: 1.4
  setup_short_choppy_max_bars: 6

  # ── LONG_TU (V10 strict) ──
  setup_long_tu_enabled: true
  setup_long_tu_priority: 3
  setup_long_tu_amp_min: 0.55
  setup_long_tu_dir_min: 0.62
  setup_long_tu_needs_adx_above: 25.0
  setup_long_tu_tp_mult: 1.4
  setup_long_tu_sl_mult: 1.1
  setup_long_tu_max_bars: 10

  # ── LONG_EXIT_TD ──
  setup_long_exit_td_enabled: true
  setup_long_exit_td_priority: 4
  setup_long_exit_td_amp_min: 0.40
  setup_long_exit_td_tp_mult: 1.2
  setup_long_exit_td_sl_mult: 1.5
  setup_long_exit_td_max_bars: 8

  # ── LONG_RANGE_STRICT ──
  setup_long_range_strict_enabled: true
  setup_long_range_strict_priority: 5
  setup_long_range_strict_amp_min: 0.60
  setup_long_range_strict_dir_min: 0.60
  setup_long_range_strict_tp_mult: 0.8
  setup_long_range_strict_sl_mult: 1.2
  setup_long_range_strict_max_bars: 6

  # ── LONG_RANGE_LIGHT ──
  setup_long_range_light_enabled: true
  setup_long_range_light_priority: 6
  setup_long_range_light_amp_min: 0.50
  setup_long_range_light_dir_min: 0.55
  setup_long_range_light_tp_mult: 0.7
  setup_long_range_light_sl_mult: 1.0
  setup_long_range_light_max_bars: 4
  setup_long_range_light_size_factor: 0.6

  early_exit_dir_inv_short: 0.55
  early_exit_dir_inv_long: 0.42
  early_exit_dir_drop_range: 0.40

  score_threshold: 0.55

optimizer_results:
  15m:
    run_date: null
    oos_score: null
    params: {}
  30m:
    run_date: null
    oos_score: null
    params: {}
  1h:
    run_date: null
    oos_score: null
    params: {}
