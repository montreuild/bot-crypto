params:
  adx_threshold: 20
  # Probabilité minimale pour générer un signal (distance à 0.5)
  # 0.55 = LightGBM doit être ≥ 55% certain de la direction
  min_prob: 0.55
  # Réentraînement toutes les N barres (walk-forward léger)
  retrain_every: 300
  # Barres d'historique utilisées pour l'entraînement
  warmup_bars: 400
  score_threshold: 0.55

