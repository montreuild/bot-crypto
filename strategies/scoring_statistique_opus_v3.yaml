params:
  adx_threshold: 20
  # Probabilité minimale LightGBM pour déclencher un signal
  # 0.60 = modèle doit être ≥ 60% confiant → filtre les signaux faibles
  min_prob: 0.60
  # Horizon de prédiction : N barres à l'avance pour labéliser
  # 3 barres = bon équilibre signal/bruit pour 30m (≈ 1h30 de mouvement)
  lookahead: 3
  # Mouvement minimum pour être considéré "décisif" (label 0 ou 1)
  # 0.003 = 0.3% — filtre le bruit, entraîne sur les vrais mouvements
  min_move_pct: 0.003
  # Barres d'historique pour la fenêtre d'entraînement
  warmup_bars: 600
  # Réentraînement toutes les N barres (walk-forward)
  retrain_every: 500
  score_threshold: 0.55

