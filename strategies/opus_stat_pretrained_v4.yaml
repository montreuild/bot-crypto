params:
  # Seuils de décision — les seuls leviers d'optimisation, les modèles étant figés.
  # Régime Trend Down (favorable, AUC dir 0.87 sur le rapport V4)
  thresh_amp_td: 0.50      # P(événement) ≥ 0.50 pour valider en TD
  thresh_dir_td: 0.10      # |P(hausse) - 0.5| ≥ 0.10 pour valider en TD
  # Régime Range / Choppy : on durcit + on réduit la taille (cf. _detect_regime)
  thresh_amp_other: 0.55
  thresh_dir_other: 0.13
  # Détection de régime (réplique V4)
  adx_threshold: 20
  # Gestion du risque — TP via trailing manager, SL fixe = sl_atr_mult × ATR14
  sl_atr_mult: 1.5
  tp_atr_mult: 1.0
  # Sortie temporelle (filet de sécurité — clustering V4 §3.1)
  max_hold_bars: 4
  # Filtrage des signaux par l'engine
  score_threshold: 0.55

optimizer_results:
  15m:
    run_date: null    # à remplir par l'optimiseur ML
    oos_score: null
    params:
      thresh_amp_td: 0.50
