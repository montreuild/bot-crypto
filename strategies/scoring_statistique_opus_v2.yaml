params:
  adx_threshold: 20
  # Trend Up  : formule miroir, seuils conservateurs (AUC non validé OOS)
  amp_thresh_tu: 0.50
  dir_dist_tu: 0.20
  # Trend Down : seuils OOS validés rapport §6.5
  amp_thresh_td: 0.50
  dir_dist_td: 0.10
  # Range/Choppy
  amp_thresh_other: 0.60
  dir_dist_other: 0.15
  rr_min: 0.6
  # Trailing stop serré — cible mouvements courts >0.4% (rapide décision)
  # trail_wide=1.0×ATR vs défaut 2.5×ATR (stop ~3× plus serré à l'entrée)
  # breakeven_r=0.6 : breakeven dès 0.6×ATR de profit (au lieu de 1.2×)
  trail_wide: 1.0
  grace_bars: 2
  breakeven_r: 0.6
  lock_r: 1.5
  tight_r: 2.5
  trail_tight: 0.5

