[mypy]
python_version = 3.14
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
disallow_untyped_defs = False
warn_unused_ignores = True
pretty = True
exclude = (?x)(
    ^tests/
    | ^data/
  )

# S-06 : on commence par les modules purs (pas d'I/O réseau) pour que le
# job CI reste lisible. Le reste du dépôt reste en follow_imports=silent.
# TEST-02 : les sections ci-dessous portent `.*` — sans lui, `[mypy-app.ml]`
# ne visait que `app/ml/__init__.py` et la garde était inerte sur tout le
# paquet.
[mypy-app.core.*]
check_untyped_defs = True

[mypy-app.engine.*]
check_untyped_defs = True

[mypy-app.ml.*]
check_untyped_defs = True

[mypy-app.api.*]
check_untyped_defs = True

[mypy-app.live.*]
check_untyped_defs = True

# ARCH-04 : mypy sur app/core + app/engine — plus aucun ignore_errors.
