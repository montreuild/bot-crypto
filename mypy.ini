[mypy]
python_version = 3.14
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
disallow_untyped_defs = False
warn_unused_ignores = True
pretty = True
exclude = (?x)(
    ^tests/
    | ^data/
  )

# S-06 : on commence par les modules purs (pas d'I/O réseau) pour que le
# job CI reste lisible. Le reste du dépôt reste en follow_imports=silent.
[mypy-app.core.sanitize]
check_untyped_defs = True

[mypy-app.core.ohlcv_gaps]
check_untyped_defs = True

[mypy-app.ml.overfitting_gate]
check_untyped_defs = True

[mypy-app.api.ws_tickets]
check_untyped_defs = True

[mypy-app.live.protocols]
check_untyped_defs = True

[mypy-app.engine.backtest_result]
check_untyped_defs = True

# ARCH-04 : mypy sur app/core + app/engine, modules encore sales ignorés.
# Chaque ligne disparaît quand le fichier est nettoyé.
[mypy-app.engine.opt_bayesian]
ignore_errors = True
