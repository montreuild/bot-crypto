backtest:
  atr_stop_mult: 2.5
  atr_tp_mult: 4.0
  atr_trail_mult: 2.2
  breakeven_r: 1.2
  grace_bars: 4
  latency_ms: 50
  max_notional_pct: 0.5
  monte_carlo_runs: 200
  partial_fill_pct: 0.95
  spread_pct: 0.0005
  trail_tight_mult: 1.7
  walk_forward_folds: 5
database:
  url: sqlite:///crypto_bot_v5.db
exchange:
  api_key: YOUR_KEY
  api_secret: YOUR_SECRET
  futures: false
  margin: false
  name: binance
logging:
  backup_count: 5
  debug: false
  level: INFO
  log_file: logs/bot.log
  max_bytes: 10485760
ml:
  blend_weight: 0.3
  enabled: true
  feature_window: 50
  min_samples: 150
  model: random_forest
  retrain_interval: 3600
notifications:
  min_pnl_to_notify: 5.0
  telegram_bot_token: YOUR_BOT_TOKEN
  telegram_chat_id: YOUR_CHAT_ID
  telegram_enabled: false
  whatsapp_enabled: false
  whatsapp_number: YOUR_PHONE
  whatsapp_token: YOUR_TOKEN
optimizer:
  auto_apply: false
  enabled: true
  method: random
  n_trials: 30
  out_of_sample_ratio: 0.3
scanner:
  dynamic_scan: false
  symbols:
  - BTC/USDC
  - ETH/USDC
  - SOL/USDC
  - BNB/USDC
  - XRP/USDC
  - ADA/USDC
  - AVAX/USDC
  - DOT/USDC
  top_n: 20
strategies:
  enabled:
  - trend
  - breakout
  - supertrend_macd
  - pullback_trend
  plugin_path: app/strategies
strategy_params:
  breakout:
    atr_expan_min: 1.05
    atr_mult: 2.0
    body_min_atr: 0.3
    cooldown: 20
    ema_mid: 50
    ema_trend: 200
    pen_max_atr: 2.0
    period: 30
    squeeze_bars: 15
    vol_min: 1.1
  ml_strategy:
    lookahead: 3
    min_train: 150
    model_type: random_forest
    n_trials: 15
    proba_long: 0.6
    proba_short: 0.4
    retrain_every: 50
    threshold: 0.002
  pullback_trend:
    adx_min: 18
    cooldown: 25
    ema_fast: 21
    ema_mid: 50
    ema_slow: 100
    ema_trend: 200
    pb_zone_pct: 0.005
    rsi_pb_high: 55
    rsi_pb_low: 35
    vol_min: 0.9
  supertrend_macd:
    cooldown: 15
    ema_mid: 50
    ema_trend: 200
    macd_fast: 12
    macd_signal: 9
    macd_slow: 26
    rsi_max_long: 72
    rsi_min_long: 30
    st_mult: 2.5
    st_period: 10
    vol_cas_c: 1.1
    vol_min: 1.0
  trend:
    adx_min: 18
    cooldown: 20
    cross_lookback: 6
    ema200_tol: 0.04
    ema_fast: 21
    ema_slow: 50
    ema_trend: 200
    overext_pct: 0.02
    rsi_high: 74
    rsi_low: 28
    vol_min: 0.9
trading:
  borrow_rate_daily: 0.0002
  capital: 1000.0
  daily_drawdown_limit: 0.05
  enabled: true
  latency_ms: 50
  maker_fee: 0.0004
  max_drawdown_global: 0.2
  max_leverage: 3
  max_longs: 3
  max_positions: 5
  max_shorts: 3
  max_trades_per_minute: 3
  min_volume_usdc_24h: 5000000
  paper_mode: true
  risk_per_trade: 0.01
  scan_interval: 60
  score_threshold: 0.6
  spread_pct: 0.0005
  taker_fee: 0.001
  timeframe: 1h
web:
  api_key: ''
  host: 127.0.0.1
  port: 8000
  refresh_interval: 5
